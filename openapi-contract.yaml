        ipHash: { type: string, nullable: true }
        userAgentHash: { type: string, nullable: true }
        action: { type: string, description: "Data changes are logged by the database as <table>.<create|update|delete> (e.g. system.update), with only the changed columns and secrets/PII redacted; auth events keep their own names (auth.login, auth.login_failed, …)" }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
