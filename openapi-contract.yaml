  # Complete API surface — F2.2 (#82). These handlers are intentionally
  # declared alongside the original V1 endpoints: OpenAPI remains the source
  # of the supported public and admin surface.
  /profile:
    get: { tags: [Profile (Public)], summary: Get the public owner profile and links, description: "Admin-edited profile data, its links, and affiliations (organizations founded or co-founded, #99).", responses: { "200": { description: "Profile (with links[] and affiliations[] — name, slug, role)" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /content/{key}:
    get:
      tags: [Content (Public)]
      summary: Get a page content block (#106)
      description: "Owner-edited site copy by key, e.g. how-i-build — { mission, principles[{ name, summary, body }] }. Also evidence — { claims[{ id, claim, where, status, proves, doesNotProve, evidence[{ label, kind, href }], reviewedAt }] } (docs/EVIDENCE-SPEC.md). 404 for an unknown key or a block not yet written."
      parameters: [{ name: key, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } }]
      responses: { "200": { description: "{ key, body }" }, "404": { $ref: "#/components/responses/NotFound" } }
  /admin/content:
    get: { tags: [Content (Admin)], summary: "Every editable content block — key, title, description, updatedAt (#106)", security: [{ adminSession: [] }], responses: { "200": { description: "{ blocks: [...] }" }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /admin/content/{key}:
    get:
      tags: [Content (Admin)]
      summary: Get one content block with its current body (null until written)
      security: [{ adminSession: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ key, title, description, body, updatedAt }" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      tags: [Content (Admin)]
