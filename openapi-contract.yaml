openapi: 3.0.3
info:
  title: MALULEKE-KS Platform API
  version: "1.0.0"
  description: >
    Contract-first specification for the MALULEKE-KS platform.
    Derives from PLATFORM-CONSTITUTION-v1.md and BUSINESS-RULES-v1.md.
    Zod schemas are generated from this contract, never hand-written independently of it.
servers:
  - url: https://malulekeks.dev/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Systems (Public)
  - name: Systems (Admin)
  - name: Inquiries
  - name: Lookups
  - name: Auth
  - name: Timeline
  - name: CV
  - name: CV (Admin)
  - name: Profile (Admin)
  - name: Settings (Admin)
  - name: Activity Log (Admin)
  - name: Content (Public)
  - name: Content (Admin)

security:
  - {}

paths:
  # ============================================================
  # PUBLIC — SYSTEMS
  # ============================================================
  /systems:
    get:
      tags: [Systems (Public)]
      summary: List published systems
      description: >
        Returns only System rows where contentStatus = published.
        Per BR-1.1, NDA_RESTRICTED and unapproved REQUIRES_APPROVAL systems
        never appear here regardless of query parameters.
      parameters:
        - name: organization
          in: query
          schema: { type: string }
          description: Filter by organization slug
        - name: domain
          in: query
          schema: { type: string }
          description: Filter by domain key
        - name: status
          in: query
          schema: { type: string }
          description: Filter by status key (finished / in_progress / planned)
        - name: flagship
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated list of public systems
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SystemPublic" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /systems/{slug}:
    get:
      tags: [Systems (Public)]
      summary: Get a single published system by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A single public system, including case study body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemPublicDetailed" }
        "308":
          description: "The slug the system used before a rename — permanent redirect (Location) to its current slug (#87, BR-1.14). Only for a system the visitor can see."
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations:
    get:
      tags: [Systems (Public)]
      summary: List organizations that have at least one published system
      description: >
        For the /systems catalog filter bar. Never includes an organization
        with zero published systems — this is a filter-options list, not a
        general org directory.
      responses:
        "200":
          description: List of organizations with public content
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    slug: { type: string }

  # ============================================================
  # ADMIN — SYSTEMS
  # ============================================================
  /admin/systems:
    get:
      tags: [Systems (Admin)]
      summary: List all systems, any content status
      security: [{ adminSession: [] }]
      parameters:
        - name: contentStatus
          in: query
          schema: { type: string, enum: [draft, published, archived] }
        - name: needsCuration
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Full system list including drafts and NDA-restricted entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SystemAdmin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Systems (Admin)]
      summary: Register a new system manually
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemCreateInput" }
      responses:
        "201":
          description: System created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemAdmin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/systems/{id}:
    get:
      tags: [Systems (Admin)]
      summary: Get one system with its unmasked curation detail
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Full system detail, including skills, status history, pace and activity }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Systems (Admin)]
      summary: Update a system, including publishing state transitions
      description: >
        BR-1.1 is enforced here: a request that sets contentStatus=published
        while clientVisibility != PUBLIC and clientApproved=false returns 409.
        BR-1.11: when the system's repo relationship requires the repo owner's
        permission, publishing without a granted answer returns 409
        OWNER_PERMISSION_REQUIRED. The database enforces both.
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemUpdateInput" }
      responses:
        "200":
          description: Updated system
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemAdmin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            Publishing blocked. CLIENT_APPROVAL_REQUIRED — client approval required (BR-1.1).
            OWNER_PERMISSION_REQUIRED — a collaborated system needs the repo owner's granted permission (BR-1.11).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ============================================================
  # INQUIRIES
  # ============================================================
  /inquiries:
    post:
      tags: [Inquiries]
      summary: Let's Talk — submit a message (docs/LETS-TALK-SPEC.md)
      description: >
        The single visitor write path, used identically by the form and the AI
        guide's draft (BR-4.2). JSON, or multipart/form-data with a "payload"
        JSON field plus up to inquiry.documents.maxFiles "documents" (PDF only,
        checked by their bytes, at most inquiry.documents.maxMegabytes in total;
        413 above the platform's request limit). Requires a formToken from GET
        /inquiries/form at least inquiry.minFillSeconds old (a missing, forged
        or too-fast token is treated like the honeypot; an expired one is 400
        FORM_EXPIRED). The honeypot "website" returns the same 201 with a
        plausible reference and stores nothing (BR-2.7). Rate-limited per
        connection (BR-2.4) and per email address (inquiry.rateLimit.perEmailPerDay).
        The category's own fields go in "details", validated by its form
        (LT-1/LT-2); a field another category uses is refused. A reused
        idempotencyKey returns the original confirmation within 10 minutes when
        the payload is the same, 409 CONFLICT when it isn't (BR-2.6). Returns
        the reference (LT-3) — it identifies, never authorises.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryCreateInput" }
          multipart/form-data:
            schema:
              type: object
              properties:
                payload: { type: string, description: "InquiryCreateInput as JSON" }
                documents: { type: array, items: { type: string, format: binary } }
      responses:
        "201":
          description: Received — with the reference to quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryConfirmation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: The idempotency key was already used for a different message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: Attachments over the request limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Rate limit exceeded (per connection or per address)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /inquiries/form:
    get:
      tags: [Inquiries]
      summary: A signed form token (the fill-time check)
      description: Fetched when the form is shown; sent back as formToken. Never cached.
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string } } }

  /inquiries/types:
    get:
      tags: [Inquiries]
      summary: Let's Talk categories, with their kinds and forms (LT-1)
      description: Active categories in the admin's order — value, label, description, the form it uses (recruitment | service | collaboration | growth | general), and its active subtypes.
      responses:
        "200":
          description: The categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value: { type: string }
                    label: { type: string }
                    description: { type: string, nullable: true }
                    form: { type: string }
                    subtypes: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }

  /admin/inquiries:
    get:
      tags: [Inquiries]
      summary: List inquiries for triage
      security: [{ adminSession: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [new, reviewed, responded, closed, needs_info, accepted, declined, on_hold, withdrawn] }
        - name: inquiryType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Inquiry inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InquiryAdmin" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/inquiries/{id}:
    get:
      tags: [Inquiries]
      summary: One inquiry in full
      description: Contact, the category's details, compensation, meetings, documents (metadata), status history, applicant-facing messages, private notes and its emails — with the moves allowed next and the version to send back.
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The inquiry, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Inquiries]
      summary: Move an inquiry on, or set its priority (LT-6)
      description: >
        Either { priority: low|normal|high|urgent } (admin metadata — it never
        decides anything), or a status change. Allowed moves are a database
        trigger: NEW → REVIEWED first (BR-2.1); then needs_info, responded (in
        discussion), accepted, declined, on_hold, withdrawn, closed; decisions
        reopen to reviewed with history kept. expectedVersion makes a change
        from a stale screen 409 STALE. internalReason is private;
        applicantMessage is stored as what the applicant was told (and emailed
        only with applicant emails on). The database records every change.
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [reviewed, responded, closed, needs_info, accepted, declined, on_hold, withdrawn] }
                expectedVersion: { type: integer }
                internalReason: { type: string, maxLength: 2000 }
                applicantMessage: { type: string, maxLength: 5000 }
                priority: { type: string, enum: [low, normal, high, urgent] }
      responses:
        "200":
          description: Inquiry updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryAdmin" }
        "409":
          description: INVALID_STATUS_TRANSITION or STALE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/inquiries/{id}/notes:
    post:
      tags: [Inquiries]
      summary: Add a private note (LT-7 — never reaches the applicant)
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 5000 } } } } }
      responses:
        "201": { description: Note added }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/inquiries/{id}/messages:
    post:
      tags: [Inquiries]
      summary: Write to the applicant, or ask for information (LT-7)
      description: Stored as applicant-facing. Emailed when notifications.applicant_emails is on; otherwise channel "manual" — sent by the owner directly. Doesn't change the status.
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: { type: string, enum: [message, info-request] }
                body: { type: string, maxLength: 5000 }
                requestedItems: { type: array, maxItems: 12, items: { type: string } }
                dueAt: { type: string, format: date-time }
      responses:
        "201": { description: Recorded }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The inquiry was anonymised }

  /admin/inquiries/{id}/meetings:
    post:
      tags: [Inquiries]
      summary: Schedule an interview or meeting (LT-5)
      description: startsAtLocal is wall-clock time in timeZone (IANA) — never assumed.
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, startsAtLocal, timeZone]
              properties:
                kind: { type: string, enum: [hr, technical, manager, panel, discovery, client, general, other] }
                startsAtLocal: { type: string, example: "2026-10-14T10:00" }
                timeZone: { type: string, example: "Europe/London" }
                durationMinutes: { type: integer, minimum: 5, maximum: 480 }
                location: { type: string }
                link: { type: string }
                contactPerson: { type: string }
                instructions: { type: string }
      responses:
        "201": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/inquiries/{id}/meetings/{meetingId}:
    patch:
      tags: [Inquiries]
      summary: Reschedule, complete, cancel or mark a no-show (LT-5)
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: meetingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { state: { type: string, enum: [completed, cancelled, no_show, rescheduled] }, startsAtLocal: { type: string }, timeZone: { type: string }, durationMinutes: { type: integer } } } } }
      responses:
        "200": { description: Updated }
        "404": { description: Not this inquiry's meeting }

  /admin/inquiries/{id}/documents/{documentId}:
    get:
      tags: [Inquiries]
      summary: Download an applicant's PDF (LT-8)
      description: Always an attachment, nosniff, sandboxed, never cached; only a document belonging to the inquiry in the path.
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/notifications:
    get:
      tags: [Inquiries]
      summary: The email outbox (LT-10)
      description: Newest first; ?state=pending|failed. Says whether email is connected at all.
      security: [{ adminSession: [] }]
      responses:
        "200": { description: The outbox, content: { application/json: { schema: { type: object } } } }

  /admin/notifications/{id}/retry:
    post:
      tags: [Inquiries]
      summary: Retry a waiting or failed email now
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Tried — the result is in state and lastError }
        "409": { description: Already sent, or email isn't connected }

  /admin/inquiry-subtypes:
    get:
      tags: [Inquiries]
      summary: Every category's kinds, active and retired
      security: [{ adminSession: [] }]
      responses:
        "200": { description: The subtypes }
    post:
      tags: [Inquiries]
      summary: Add a kind to a category (EXT-1)
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [inquiryType, key, label], properties: { inquiryType: { type: string }, key: { type: string }, label: { type: string }, sortOrder: { type: integer } } } } }
      responses:
        "201": { description: Added }
        "409": { description: LOOKUP_KEY_EXISTS }

  /admin/inquiry-subtypes/{id}:
    patch:
      tags: [Inquiries]
      summary: Rename, reorder, retire or restore a kind (BR-8.2 — never deleted; "other" can't be retired)
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { label: { type: string }, sortOrder: { type: integer }, active: { type: boolean } } } } }
      responses:
        "200": { description: Updated }
        "409": { description: The other option can't be retired }

  # ============================================================
  # LOOKUPS — one generic endpoint for every EXT-1 lookup table
  # ============================================================
  /lookups/{type}:
    get:
      tags: [Lookups]
      summary: Read lookup values for a given type
      description: >
        One contract for every open dimension in the system — Status, Domain,
        InquiryType, MilestoneType, SkillCategory, RepoRelationship. A new lookup type added
        under EXT-1 needs no new endpoint, only a new value of {type}.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [status, domain, inquiry-type, milestone-type, skill-category, repo-relationship, title-kind, organization-kind]
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
          description: Admin-only param; ignored for unauthenticated requests (BR-8.2)
      responses:
        "200":
          description: List of lookup values for the given type
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LookupValue" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Lookups]
      summary: Add a new lookup value (BR-8.1)
      security: [{ adminSession: [] }]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label]
              properties:
                key: { type: string }
                label: { type: string }
                stage: { $ref: "#/components/schemas/PipelineStage" }
                colorToken: { $ref: "#/components/schemas/StatusColorToken" }
                requiresOwnerPermission: { type: boolean, description: "type=repo-relationship only (BR-1.11)" }
                autoDraftOnShip: { type: boolean, description: "type=milestone-type only; choosing one hands the flag over from any other type" }
      responses:
        "201":
          description: Lookup value created. For type=status, stage defaults to queued and colorToken to signal-planned when omitted. Extras a type doesn't have are refused with 400.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            The key already exists. Code LOOKUP_KEY_DEPRECATED when the existing value is soft-deprecated —
            reactivate it instead of re-creating it (BR-8.3); LOOKUP_KEY_EXISTS when it is active.

  /lookups/{type}/{id}:
    patch:
      tags: [Lookups]
      summary: Edit an existing lookup value (label and its type's extras)
      description: The key is immutable (BR-8.3 keeps keys unique and stable). Changing a status's stage moves every system in that status between the shipped / in-progress / queued counts with no code change (EXT-1). Making a repo relationship require the owner's permission re-checks every system using it (BR-1.11).
      security: [{ adminSession: [] }]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LookupUpdateInput" }
      responses:
        "200":
          description: Updated lookup value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: OWNER_PERMISSION_REQUIRED — a published system uses this relationship without the owner's granted permission (BR-1.11); unpublish it or record the permission first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /lookups/{type}/{id}/deprecate:
    post:
      tags: [Lookups]
      summary: Soft-deprecate a lookup value in use (BR-8.2)
      description: Marks a value inactive without deleting it. Hard delete is a separate, unexposed operation reserved for never-used values.
      security: [{ adminSession: [] }]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Value marked inactive
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # AUTH
  # ============================================================
  /admin/auth/login:
    post:
      tags: [Auth]
      summary: Admin login step 1 — credentials
      description: On success, returns a challenge requiring 2FA (BR-3.1). Never issues a session on this call alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Credentials accepted, 2FA challenge issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeToken: { type: string }
        "401":
          description: Invalid credentials, or account locked (BR-3.2)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Admin login step 2 — TOTP or recovery code verification
      description: >
        `code` is either a 6-digit TOTP code or a recovery code (Design
        System §5). 5 failed attempts against the same challengeToken
        invalidates it (BR-3.6) rather than allowing continued guessing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, minLength: 6, maxLength: 32 }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionExpiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/auth/recovery-codes:
    get: { tags: [Auth], summary: "How many unused recovery codes remain, and whether that's low (< 3, BR-3.12)", security: [{ adminSession: [] }], responses: { "200": { description: "{ remaining, low }" }, "401": { $ref: "#/components/responses/Unauthorized" } } }
    post:
      tags: [Auth]
      summary: Regenerate the recovery codes — ten new ones, shown once; every old code stops working (BR-3.11, BR-3.12)
      description: "Needs the current password and a live, single-use TOTP code; failures count against the session like a password change (the fifth ends it: SESSION_REVOKED)."
      security: [{ adminSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currentPassword, code], properties: { currentPassword: { type: string, format: password }, code: { type: string, pattern: "^\\d{6}$" } } } } } }
      responses:
        "200": { description: "{ codes: string[10], remaining: 10, low: false } — show once, never retrievable again" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "UNAUTHORIZED (credentials) or SESSION_REVOKED (fifth failure)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out — ends every session of the admin, not just this one (#104)
      description: "Increments the session generation (like a password change) and clears the cookie. Logged as auth.logout."
      security: [{ adminSession: [] }]
      responses:
        "200": { description: "{ signedOut: true }" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the admin password and invalidate every prior session
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, code]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 256 }
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200": { description: Password changed and replacement session established; every older session has ended (BR-3.15) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >-
            UNAUTHORIZED — the current password or TOTP code was wrong (codes are single-use, BR-3.14).
            SESSION_REVOKED — the fifth failed attempt on this session ended it; sign in again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ============================================================
  # TIMELINE & CV
  # ============================================================
  /timeline:
    get:
      tags: [Timeline]
      summary: List public timeline entries
      parameters:
        - name: milestoneType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Timeline entries, chronological
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelineEntry" }

  /cv/generate:
    post:
      tags: [CV]
      summary: Generate the CV from current data (BR-7.1) — PDF or Word, the same content
      description: >
        The CV engine (#74). One structured CV built from the public views and
        the owner's profile, rendered ATS-safe (one column, standard headings,
        real text, links written out). A target role reorders projects, bullets
        and skills by relevance — it never rewrites content. Prior documents of
        the same role and format are superseded, never deleted (BR-7.2).
        Rate-limited per connection (platform settings cv.rateLimit.*).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetRole: { type: string, nullable: true, maxLength: 100 }
                format: { $ref: "#/components/schemas/CvFormat" }
      responses:
        "201":
          description: Generated document reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileUrl: { type: string, format: uri }
                  generatedAt: { type: string, format: date-time }
                  format: { $ref: "#/components/schemas/CvFormat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: "The generated CV option is hidden by the admin (BR-7.5)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

