    post: { tags: [Metrics (Admin)], summary: Define a metric, security: [{ adminSession: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MetricInput" } } } }, responses: { "201": { description: Created }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /admin/metrics/{key}:
    patch: { tags: [Metrics (Admin)], summary: Update a metric definition, security: [{ adminSession: [] }], parameters: [{ name: key, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MetricUpdateInput" } } } }, responses: { "200": { description: Updated }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/metrics/{key}/proposals:
    post: { tags: [Metrics (Admin)], summary: Propose a manual metric value, security: [{ adminSession: [] }], parameters: [{ name: key, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MetricProposalInput" } } } }, responses: { "201": { description: Proposed }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/metrics/compute:
    post: { tags: [Metrics (Admin)], summary: Compute and propose registered metrics, security: [{ adminSession: [] }], responses: { "200": { description: Computation result }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { description: Computation already running } } }
  /admin/metrics/snapshots/{id}/approve:
    post: { tags: [Metrics (Admin)], summary: Approve a proposed metric snapshot, security: [{ adminSession: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Updated metric }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Invalid snapshot transition } } }
  /admin/metrics/snapshots/{id}/reject:
    post: { tags: [Metrics (Admin)], summary: Reject a proposed metric snapshot, security: [{ adminSession: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Updated metric }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Invalid snapshot transition } } }
  /admin/freshness:
    get: { tags: [Overview (Admin)], summary: "Live content nobody has edited or reviewed for content.freshnessDays, oldest first (#89, BR-1.16)", description: "Systems, roles, education and the profile. Only a real edit to what visitors see, or mark-reviewed, restarts the clock — GitHub sync writes don't.", security: [{ adminSession: [] }], responses: { "200": { description: "{ thresholdDays, items: [{ kind, id, title, reviewedAt, daysSince }] }" }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /admin/freshness/{kind}/{id}/reviewed:
    post: { tags: [Overview (Admin)], summary: "Mark content reviewed — still accurate; its clock restarts (BR-1.16)", security: [{ adminSession: [] }], parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [system, experience, education, profile] } }, { name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: "{ kind, id, reviewedAt }" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /admin/jobs:
    get: { tags: [Jobs (Admin)], summary: "List registered jobs (with schedule) and recent runs (with what started each)", security: [{ adminSession: [] }], parameters: [{ name: job, in: query, schema: { type: string } }], responses: { "200": { description: "{ jobs: [{ name, description, rules, schedule }], data: [{ id, job, status, startedAt, finishedAt, durationMs, summary, error, trigger, adminUserId }] }" }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /admin/jobs/{job}/run:
    post: { tags: [Jobs (Admin)], summary: "Run a registered job now (#94) — same runner and lock as the schedule, recorded as started by this admin", security: [{ adminSession: [] }], parameters: [{ name: job, in: path, required: true, schema: { type: string, enum: [maintenance.daily, metrics.compute, github.sync] } }], responses: { "200": { description: "{ status: succeeded, runId, result }" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: "ALREADY_RUNNING" }, "500": { description: "{ status: failed, runId, error } — the run is recorded with its error" } } }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: >-
        HTTP-only, SameSite=Strict session cookie, issued only after 2FA verification (BR-3.1).
        Every state-changing admin request — and the two login steps — is refused with
        403 CSRF_REJECTED when its Origin or Sec-Fetch-Site names another site (BR-3.9).

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid admin session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    OrganizationInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        role: { type: string, nullable: true, maxLength: 80, description: "The owner's role, e.g. Founder — set makes it an affiliation" }
        isClient: { type: boolean, default: false, description: "BR-1.2 — the default for systems created afterwards only" }
        githubLogins: { type: array, items: { type: string }, maxItems: 20, description: "GitHub accounts whose repos the sync files here" }
        kind: { type: string, nullable: true, description: "An OrganizationKind key — personal, venture, client, … (F5c)" }
    ImpactInput:
      type: object
      required: [label, value]
      properties:
        label: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
        context: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, default: 0 }
    SystemSkillsInput:
      type: object
      required: [skillIds]
      properties:
        skillIds: { type: array, items: { type: string } }
    MetricInput:
      type: object
      required: [key, label, unit]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_.-]*$" }
        label: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        unit: { type: string, minLength: 1 }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        active: { type: boolean, default: true }
    MetricUpdateInput:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        unit: { type: string, minLength: 1 }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
    MetricProposalInput:
      type: object
      required: [value]
      properties:
        value: { type: number }
    ContentRevision:
      type: object
      properties:
        id: { type: string }
        field: { type: string, enum: [caseStudyBody, description] }
        body: { type: string, nullable: true }
        actorType: { type: string, enum: [ADMIN, ANONYMOUS, SYSTEM] }
        adminUserId: { type: string, nullable: true }
        backfilled: { type: boolean }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }
        matchesCurrent: { type: boolean }
    CvOption:
      type: object
      description: "One CV option a visitor can choose (#92). generated → call generate; uploaded → download a file."
      required: [kind, label, note, formats]
      properties:
        kind: { type: string, enum: [generated, uploaded] }
        label: { type: string }
        note: { type: string }
        formats: { type: array, items: { type: string, enum: [pdf, docx] } }
        generate: { type: object, description: "generated only", properties: { method: { type: string, enum: [POST] }, url: { type: string } } }
        uploadedAt: { type: string, format: date-time, nullable: true, description: "uploaded only — the newest current file" }
        files:
          type: array
          description: uploaded only
          items: { type: object, properties: { format: { type: string, enum: [pdf, docx] }, byteSize: { type: integer }, uploadedAt: { type: string, format: date-time }, url: { type: string } } }
    CvUploadVersion:
      type: object
      properties:
        id: { type: string }
        format: { type: string, enum: [pdf, docx] }
        fileName: { type: string, description: As uploaded — admin only }
        byteSize: { type: integer }
        sha256: { type: string }
        uploadedAt: { type: string, format: date-time }
        supersededAt: { type: string, format: date-time, nullable: true }
        current: { type: boolean }
    CvOptions:
      type: object
      properties:
        showGenerated: { type: boolean }
        showUploaded: { type: boolean }
        firstOption: { type: string, enum: [generated, uploaded] }
        generatedLabel: { type: string, maxLength: 60 }
        generatedNote: { type: string, maxLength: 200 }
        uploadedLabel: { type: string, maxLength: 60 }
        uploadedNote: { type: string, maxLength: 200 }
        updatedAt: { type: string, format: date-time }
    CvOptionsUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        showGenerated: { type: boolean }
        showUploaded: { type: boolean }
        firstOption: { type: string, enum: [generated, uploaded] }
        generatedLabel: { type: string, minLength: 1, maxLength: 60 }
        generatedNote: { type: string, maxLength: 200 }
        uploadedLabel: { type: string, minLength: 1, maxLength: 60 }
        uploadedNote: { type: string, maxLength: 200 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - NOT_FOUND
                - CLIENT_APPROVAL_REQUIRED
                - INVALID_STATUS_TRANSITION
                - RATE_LIMITED
                - ACCOUNT_LOCKED
                - CHALLENGE_EXPIRED
                - CHALLENGE_INVALID
                - LOOKUP_KEY_DEPRECATED
                - LOOKUP_KEY_EXISTS
                - OWNER_PERMISSION_REQUIRED
                - INTERNAL_ERROR
              description: Closed set, kept in lockstep with lib/schemas.ts ErrorCodeEnum — never a freeform string.
            message: { type: string }
            details: { type: object, nullable: true }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    LookupValue:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        active: { type: boolean }
        stage: { $ref: "#/components/schemas/PipelineStage", description: "type=status only" }
        colorToken: { $ref: "#/components/schemas/StatusColorToken", description: "type=status only" }
        requiresOwnerPermission: { type: boolean, description: "type=repo-relationship only — publishing needs the repo owner's permission (BR-1.11)" }
        autoDraftOnShip: { type: boolean, description: "type=milestone-type only — the type a system's first ship is auto-drafted as" }

    PipelineStage:
      type: string
      enum: [shipped, building, queued]
      description: Which homepage count a Status belongs to. A fixed control dimension (EXT-1 exception, like ContentStatus); the statuses themselves stay an open lookup.

    StatusColorToken:
      type: string
      enum: [signal-finished, signal-progress, signal-planned]
      description: Curated, contrast-checked palette a Status may use (DESIGN-SYSTEM.md §1).

    PlatformSetting:
      type: object
      properties:
        key: { type: string }
        value: { description: "Effective value (the stored override, or the default)" }
        default: { description: "Registry default — the business-rule value" }
        isDefault: { type: boolean }
        description: { type: string }
        rule: { type: string, example: BR-2.4 }
        updatedAt: { type: string, format: date-time, nullable: true }

    PlatformSettingUpdateInput:
      type: object
      required: [value]
      properties:
        value: { description: "Must satisfy the setting's registered type and bounds" }

    LookupUpdateInput:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        stage: { $ref: "#/components/schemas/PipelineStage" }
        colorToken: { $ref: "#/components/schemas/StatusColorToken" }
        requiresOwnerPermission: { type: boolean }
        autoDraftOnShip: { type: boolean }

    OwnerPermission:
      type: string
      enum: [not_required, not_requested, requested, granted, declined]
      description: The repo owner's answer for a collaborated system (BR-1.11). A fixed control state; the database keeps it consistent with the repo relationship.

    SystemPublic:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        organization: { type: string }
        status: { type: string }
        statusColorToken: { type: string, description: "CSS custom-property/Tailwind token name (e.g. signal-finished) — status color is data (EXT-1), not a client-side hardcoded map" }
        domain: { type: string, nullable: true }
        description: { type: string }
        repoUrl: { type: string, nullable: true, description: "Null when clientVisibility = NDA_RESTRICTED (BR-1.3) or the repo is private (BR-1.7)" }
        liveUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true, description: "Homepage preview image; renders a technical placeholder when absent" }
        techStack: { type: array, items: { type: string } }
        isFlagship: { type: boolean }
        repoPrivate: { type: boolean, description: "BR-1.7 — shown as a private repository; access is available on request" }

    SystemPublicDetailed:
      allOf:
        - $ref: "#/components/schemas/SystemPublic"
        - type: object
          properties:
            caseStudyBody: { type: string }
            caseStudyAuthor: { type: string, enum: [ai, owner], nullable: true, description: "BR-4.5 — 'ai' when the case study was written by AI from the public repo (label it as such), 'owner' when the owner wrote it; null when there is none" }
            caseStudyWrittenAt: { type: string, format: date-time, nullable: true, description: "When the AI last wrote it; null for the owner's own" }
            impacts:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: string }
            testimonials:
              type: array
              items: { $ref: "#/components/schemas/TestimonialPublic" }

    TestimonialPublic:
      type: object
      description: Only ever returned where hasPermission=true (BR-6.1)
      properties:
        authorName: { type: string }
        authorRole: { type: string, nullable: true }
        organization: { type: string, nullable: true }
        quote: { type: string }

    SystemAdmin:
      allOf:
        - $ref: "#/components/schemas/SystemPublicDetailed"
        - type: object
          properties:
            contentStatus: { type: string, enum: [draft, published, archived] }
            publishAt: { type: string, format: date-time, nullable: true, description: "BR-1.13 — admin responses only. When published content goes live; null = as soon as published" }
            clientVisibility: { type: string, enum: [PUBLIC, REQUIRES_APPROVAL, NDA_RESTRICTED, ANONYMIZED_ONLY] }
            clientApproved: { type: boolean, description: "Authorizes publishing (BR-1.1) — see nameDisclosureApproved for real-name authorization" }
            nameDisclosureApproved: { type: boolean, description: "Separate from clientApproved (BR-1.4) — authorizes revealing the real org name for an ANONYMIZED_ONLY system" }
            needsCuration: { type: boolean }
            sortOrder: { type: integer }
            featuredOnHome: { type: boolean, description: "Admin-chosen for the homepage (published systems only are shown)" }
            homeOrder: { type: integer, description: "Order among homepage-featured systems, ascending" }
            onCv: { type: boolean, description: "Listed under Projects on the CV (published systems only)" }
            cvOrder: { type: integer }
            repoRelationship: { type: string, nullable: true, description: "RepoRelationship key (e.g. owner, collaborator)" }
            ownerPermission: { $ref: "#/components/schemas/OwnerPermission" }
            ownerPermissionFrom: { type: string, nullable: true, description: "Who granted or declined — the repo owner's name or GitHub login" }
            ownerPermissionAt: { type: string, format: date-time, nullable: true, description: "Set by the database when the answer changes" }
            ownerPermissionNote: { type: string, nullable: true }
            github:
              type: object
              description: Sourced from GitHub by the sync; null values until synced
              properties:
                fullName: { type: string, nullable: true }
                ownerLogin: { type: string, nullable: true }
                pushedAt: { type: string, format: date-time, nullable: true }
                languages: { type: object, nullable: true, additionalProperties: { type: integer }, description: "Bytes per language" }
                topics: { type: array, items: { type: string } }
                stars: { type: integer, nullable: true }
                syncedAt: { type: string, format: date-time, nullable: true }
            writeup:
              type: object
              description: "BR-4.5 — who wrote the summary and the case study; the database refuses a generated write over the owner's words"
              properties:
                descriptionSource: { type: string, enum: [sync, generated, owner] }
                caseStudySource: { type: string, enum: [none, generated, owner] }
                generatedAt: { type: string, format: date-time, nullable: true }

    SystemCreateInput:
      type: object
      required: [name, slug, organizationId, statusId, description]
      properties:
        name: { type: string }
        slug: { type: string }
        organizationId: { type: string }
        statusId: { type: string }
        domainId: { type: string, nullable: true }
        description: { type: string }
        repoUrl: { type: string, nullable: true }
        liveUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true }
        techStack: { type: array, items: { type: string } }
        clientVisibility: { type: string, enum: [PUBLIC, REQUIRES_APPROVAL, NDA_RESTRICTED, ANONYMIZED_ONLY] }

    SystemUpdateInput:
      type: object
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 100, description: "#87 / BR-1.14 — rename the URL; the old slug keeps redirecting permanently. 409 SLUG_TAKEN (another system's current slug) or SLUG_RESERVED (another system's old slug)" }
        contentStatus: { type: string, enum: [draft, published, archived] }
        publishAt: { type: string, format: date-time, nullable: true, description: "BR-1.13 — schedule publication: with contentStatus published, the content goes live at this time (checked by every publish gate now). Omitted = unchanged; null = live as soon as published. Refused (400) on unpublished content" }
        clientApproved: { type: boolean }
        nameDisclosureApproved: { type: boolean }
        isFlagship: { type: boolean }
        sortOrder: { type: integer }
        featuredOnHome: { type: boolean }
        homeOrder: { type: integer, minimum: 0 }
        onCv: { type: boolean }
        cvOrder: { type: integer, minimum: 0 }
        repoRelationship: { type: string, nullable: true, description: "A RepoRelationship key; null clears it" }
        ownerPermission: { type: string, enum: [not_requested, requested, granted, declined] }
        ownerPermissionFrom: { type: string, nullable: true, description: "Required (by the database) when the answer is granted or declined" }
        ownerPermissionNote: { type: string, nullable: true }
        caseStudyBody: { type: string }
        repoUrl: { type: string, nullable: true }
        liveUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true }

    InquiryCreateInput:
      type: object
      required: [name, email, message, inquiryType]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        message: { type: string, minLength: 20, maxLength: 5000, description: "BR-2.3" }
        inquiryType:
          type: string
          pattern: "^[a-z0-9]+([_-][a-z0-9]+)*$"
          description: "An active InquiryType lookup key (GET /lookups/inquiry_type). A lookup (EXT-1): new types need no API change; unknown or deprecated keys are a 400 (BR-8.2)."
        source: { type: string, nullable: true, description: "Captured automatically, not client-supplied (BR-2.5); \"direct\" when no Referer header is present" }
        idempotencyKey: { type: string, format: uuid, nullable: true, description: "Optional; the same key and the same payload within 10 minutes returns the original confirmation; a different payload is 409 (BR-2.6)" }
        formToken: { type: string, description: "From GET /inquiries/form — required; the fill-time check" }
        subtype: { type: string, description: "A kind within the category (GET /inquiries/types); 'other' needs subtypeOther (LT-1)" }
        subtypeOther: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40, description: "Required when preferredChannel is phone, whatsapp or sms" }
        organization: { type: string, maxLength: 160 }
        role: { type: string, maxLength: 120 }
        organizationWebsite: { type: string, maxLength: 300, description: "The visitor's site, a full https link. Never 'website' — that name is the hidden honeypot (BR-2.7)" }
        profileUrl: { type: string, maxLength: 300 }
        preferredChannel: { type: string, enum: [email, phone, whatsapp, sms, other] }
        preferredChannelOther: { type: string, maxLength: 120 }
        details: { type: object, description: "The category's own fields, validated by its form (lib/inquiries/forms.ts) — compensation { mode: range|discuss|unpaid|not-applicable, … } and meeting { status: none|tbd|scheduled, … } where the form has them (LT-1, LT-4, LT-5)" }

    InquiryConfirmation:
      type: object
      properties:
        id: { type: string, description: "Kept for v1 compatibility; authorises nothing" }
        reference: { type: string, example: "KS-26-7QM4-K2", description: "LT-3 — quote it; identifies, never authorises" }
        status: { type: string, example: "new" }
        submittedAt: { type: string, format: date-time }

    InquiryAdmin:
      allOf:
        - $ref: "#/components/schemas/InquiryConfirmation"
        - type: object
          properties:
            name: { type: string }
            email: { type: string }
            message: { type: string }
            inquiryType: { type: string }
            source: { type: string, nullable: true }

    TimelineEntry:
      type: object
      properties:
        id: { type: string }
        milestoneType: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
        datePrecision: { type: string, enum: [day, month, year], description: "How much of the date is known — show only that much (a month or year is stored as its first day)" }
        tags: { type: array, items: { type: string } }
        contentStatus: { type: string, enum: [draft, published, archived], description: "Public reads return published entries only" }
        publishAt: { type: string, format: date-time, nullable: true, description: "BR-1.13 — admin responses only. When published content goes live; null = as soon as published" }
        autoDrafted: { type: boolean, description: "Drafted by the database when a system first shipped; awaits the admin's approval" }
        systemId: { type: string, nullable: true }

    TimelineCreateInput:
      type: object
      required: [milestoneTypeId, title, date]
      properties:
        milestoneTypeId: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
        datePrecision: { type: string, enum: [day, month, year], description: "Omitted: day on create, unchanged on update" }
        media: { type: string, nullable: true }
        tags: { type: array, items: { type: string }, default: [] }
        contentStatus: { type: string, enum: [draft, published, archived], description: "Omitted on create = published; omitted on update = unchanged. Publishing an auto-drafted entry approves it." }
        publishAt: { type: string, format: date-time, nullable: true, description: "BR-1.13 — schedule publication: with contentStatus published, the content goes live at this time (checked by every publish gate now). Omitted = unchanged; null = live as soon as published. Refused (400) on unpublished content" }

    ExperienceEntry:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        organization: { type: string }
        location: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        description: { type: string }
        highlights: { type: array, items: { type: string }, description: "CV achievement bullets, in order" }
        contentStatus: { type: string, enum: [draft, published, archived], description: "Only published roles appear on /cv and in the generated CV" }
        publishAt: { type: string, format: date-time, nullable: true, description: "BR-1.13 — admin responses only. When published content goes live; null = as soon as published" }
        skills: { type: array, items: { type: string } }

    ExperienceInput:
      type: object
      required: [title, organization, startDate, description]
      properties:
        title: { type: string, minLength: 1 }
        organization: { type: string, minLength: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, minLength: 1 }
        highlights: { type: array, items: { type: string, maxLength: 300 }, maxItems: 15, default: [] }
        contentStatus: { type: string, enum: [draft, published, archived], description: "Omitted on create = published; omitted on update = unchanged" }
        publishAt: { type: string, format: date-time, nullable: true, description: "BR-1.13 — schedule publication: with contentStatus published, the content goes live at this time (checked by every publish gate now). Omitted = unchanged; null = live as soon as published. Refused (400) on unpublished content" }
        skillIds: { type: array, items: { type: string }, default: [] }

