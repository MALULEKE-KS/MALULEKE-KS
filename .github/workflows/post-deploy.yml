# After every successful production deployment (Vercel reports it to GitHub as
# a deployment status), check that every core page serves that one build
# (docs/V2-IMPROVEMENT-SPEC.md WP-110). Read-only: it only fetches public pages.
name: post-deploy

on:
  deployment_status:
  # By hand (Actions → post-deploy → Run workflow): measure production now, without a deploy.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Every core page reports the deployed build
        # The production domain (repository variable PRODUCTION_URL): a deployment's own address is behind
        # Vercel's login, so it can't be read. Falls back to it if the variable isn't set.
        run: node scripts/smoke-build.mjs "${{ vars.PRODUCTION_URL || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}" "${{ github.event.deployment.sha }}"

  budgets:
    # After the smoke check passes: no core page may have got heavier than perf-budgets.json allows
    # (docs/V2-IMPROVEMENT-SPEC.md WP-102). Weights fail the job; Lighthouse targets only warn (D-027).
    needs: smoke
    # After a production deploy once the smoke check has passed — or by hand, when there is no deploy to compare (the smoke check is skipped then).
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.smoke.result == 'success' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Every core page is within its weight budget
        env:
          LH_REPORT_DIR: lighthouse-reports
        run: node scripts/check-budgets.mjs "${{ vars.PRODUCTION_URL || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}" --lighthouse both
      # Every Lighthouse report and its diagnosis (LCP phases, render-blocking, unused JS, main-thread work), kept with the run.
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
