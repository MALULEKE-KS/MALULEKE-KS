# After every successful production deployment (Vercel reports it to GitHub as
# a deployment status), check that every core page serves that one build
# (docs/V2-IMPROVEMENT-SPEC.md WP-110). Read-only: it only fetches public pages.
name: post-deploy

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Every core page reports the deployed build
        # The production domain (repository variable PRODUCTION_URL): a deployment's own address is behind
        # Vercel's login, so it can't be read. Falls back to it if the variable isn't set.
        run: node scripts/smoke-build.mjs "${{ vars.PRODUCTION_URL || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}" "${{ github.event.deployment.sha }}"
