<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The platform's own selection motif (Design System §7): four corner
       brackets in ink around a single brass square, the same brass square that
       marks a flagship system. Colors are the design tokens: paper, ink, accent. -->
  <rect width="32" height="32" fill="#0B0C0E"/>
  <path d="M4 12V4h8M20 4h8v8M28 20v8h-8M12 28H4v-8" fill="none" stroke="#F4F2EE" stroke-width="3" stroke-linecap="square"/>
  <rect x="12" y="12" width="8" height="8" fill="#FF5B1F"/>
</svg>
